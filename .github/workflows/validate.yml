name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so upstream Home Assistant / HACS rule changes surface on their own.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets live in home-assistant/brands, not this repo. Drop this
          # line once the brands PR for `unsplash` is merged (see
          # HACS_CHECKLIST.md) so the check starts enforcing it.
          ignore: brands
